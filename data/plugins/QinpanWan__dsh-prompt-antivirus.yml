  zh: '全局提示注入 / 上下文病毒防御：扫描工具参数、工具结果、进模型前消息与出站流；隔离/阻断/监控三模式、金丝雀陷阱、可演进磁盘签名库（学习/导入/导出）。'
install: dsh plugin --profile web add github:QinpanWan/dsh-prompt-antivirus
